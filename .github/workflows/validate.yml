name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate and test each plugin
        run: |
          set -e
          for dir in plugins/*/; do
            echo "::group::$dir"
            claude plugin validate --strict "$dir"
            if find "$dir" -name '*.test.ts' -o -name '*.test.tsx' | grep -q .; then
              claude plugin test "$dir"
            fi
            echo "::endgroup::"
          done
      - name: Catalog is consistent
        run: node --experimental-strip-types scripts/catalog.mts --check
      - name: Generated assets are up to date
        run: |
          set -e
          for script in scripts/assets/*.mts; do
            [ -e "$script" ] || continue
            node --experimental-strip-types "$script" --check
          done
      - name: Changed plugins bumped their version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base commit to compare against; skipping."
            exit 0
          fi
          bash scripts/check-version-bumps.sh "$base" HEAD
